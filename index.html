<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Suma">
<meta name="theme-color" content="#17131f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Suma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #17131f; --bg2: #241d33; --card: #fffaf0; --edge: #e8dcc0; --ink: #2a2236; --gold: #ffcc33; --line: #5a4a7a; --red: #e04848; --green: #3ad06a; --dim: #9a90aa; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: #fff; font-family: 'Pixelify Sans', system-ui, sans-serif; font-size: 18px; -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 8px; border-bottom: 3px solid var(--line); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { font-family: 'Press Start 2P', monospace; font-size: 13px; color: var(--gold); text-shadow: 2px 2px 0 #b8541c; }
  .status { font-size: 13px; padding: 3px 8px; border-radius: 10px; background: var(--bg2); color: #c8c0d8; white-space: nowrap; }
  .status.on { color: #b8f0c8; }
  .game { color: #c8c0d8; font-size: 15px; margin-top: 4px; }
  nav { display: flex; gap: 6px; margin-top: 10px; }
  nav button { flex: 1; font: inherit; font-size: 15px; padding: 8px 4px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg2); color: #fff; }
  nav button.on { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 600; box-shadow: 0 3px 0 #b8541c; }
  .badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: #fff; font-size: 13px; margin-left: 4px; }
  main { padding: 12px 16px 40px; }
  .card { display: flex; gap: 12px; align-items: center; background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; border: 3px solid var(--edge); box-shadow: 0 3px 0 rgba(0,0,0,.35); width: 100%; text-align: left; font: inherit; }
  .card canvas { flex: none; image-rendering: pixelated; width: 40px; height: 50px; }
  .card .who { font-weight: 600; }
  .card .role { color: #7a6f8a; font-size: 14px; }
  .card .q { margin-top: 2px; font-size: 16px; line-height: 1.3; }
  .card .t { color: #9a90aa; font-size: 13px; margin-top: 2px; }
  .card.call { border-color: var(--red); }
  .busy { color: #1f8a4a; font-size: 13px; }
  .empty { text-align: center; color: #b8b0c8; padding: 36px 12px; line-height: 1.45; }
  .rep { display: block; }
  .rep .title { font-weight: 600; }
  .rep .said { margin-top: 6px; padding: 6px 8px; background: #f0e8ff; border-radius: 8px; font-size: 15px; }
  .panel { background: var(--bg2); border: 3px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; line-height: 1.4; }
  .panel h2 { font-family: 'Press Start 2P', monospace; font-size: 12px; color: var(--gold); margin: 0 0 10px; line-height: 1.5; }
  .btn { display: inline-block; font: inherit; font-size: 17px; padding: 10px 16px; border-radius: 10px; border: none; background: var(--gold); color: var(--ink); font-weight: 600; box-shadow: 0 3px 0 #b8541c; margin-top: 8px; }
  .btn.ghost { background: transparent; color: #fff; border: 2px solid var(--line); box-shadow: none; }
  .switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .switch input { width: 26px; height: 26px; accent-color: var(--gold); }
  /* chat */
  #chat { position: fixed; inset: 0; background: var(--bg); z-index: 5; display: flex; flex-direction: column; }
  #chat.hidden { display: none; }
  #chat-head { display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 14px 8px; border-bottom: 3px solid var(--line); }
  #chat-head button { font: inherit; background: none; border: none; color: var(--gold); font-size: 17px; padding: 6px 4px; }
  #chat-head canvas { image-rendering: pixelated; width: 32px; height: 40px; }
  #log { flex: 1; overflow-y: auto; padding: 12px 14px; -webkit-overflow-scrolling: touch; }
  .msg { max-width: 86%; padding: 9px 12px; border-radius: 14px; margin-bottom: 8px; line-height: 1.35; font-size: 17px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.npc { background: var(--card); color: var(--ink); border-bottom-left-radius: 4px; }
  .msg.user { background: var(--gold); color: var(--ink); margin-left: auto; border-bottom-right-radius: 4px; }
  .msg.user.waiting { opacity: .75; }
  .msg.note { background: none; color: #b8b0c8; font-size: 14px; text-align: center; max-width: 100%; }
  .typing { color: #b8b0c8; font-size: 15px; padding: 4px 2px; }
  #choices { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 6px; }
  #choices button { font: inherit; font-size: 15px; padding: 8px 12px; border-radius: 16px; border: 2px solid var(--gold); background: #2a2140; color: #fff; }
  #compose { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 3px solid var(--line); background: #1e1829; }
  #compose textarea { flex: 1; font: inherit; font-size: 17px; border-radius: 12px; border: 2px solid var(--line); padding: 9px 10px; resize: none; max-height: 140px; background: #fff; color: var(--ink); }
  #compose button { font: inherit; font-size: 20px; width: 46px; height: 46px; border-radius: 12px; border: 2px solid var(--line); background: #2a2140; color: #fff; flex: none; }
  #compose #send { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  #compose .on { background: var(--red) !important; border-color: var(--red) !important; }
  #pics { display: flex; gap: 6px; padding: 0 12px 6px; }
  #pics img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; border: 2px solid var(--gold); }
  .offline-note { margin: 0 14px 8px; padding: 8px 10px; border-radius: 10px; background: #2a2140; color: #c8c0d8; font-size: 14px; line-height: 1.35; }
  .hint { color: #8a809a; font-size: 13px; text-align: center; margin-top: 16px; line-height: 1.4; }
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo">SUMA</div><div class="status" id="status">…</div></div>
  <div class="game" id="game"></div>
  <nav>
    <button id="tab-calls" class="on">📞 Calls <span id="calls-n"></span></button>
    <button id="tab-team">👥 Team</button>
    <button id="tab-reports">📋 Reports</button>
  </nav>
</header>
<main id="list"></main>

<div id="chat" class="hidden">
  <div id="chat-head"><button id="back">‹ Back</button><canvas id="chat-face" width="48" height="60"></canvas><div><div id="chat-name" class="who"></div><div id="chat-role" style="color:#b8b0c8;font-size:14px"></div></div></div>
  <div id="log"></div>
  <div id="offline" class="offline-note" hidden></div>
  <div id="choices"></div>
  <div id="pics"></div>
  <div id="compose">
    <button id="attach" title="Add a picture">📎</button>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <textarea id="text" rows="1" placeholder="Type, or tap 🎤 on your keyboard"></textarea>
    <button id="mic" title="Talk" hidden>🎤</button>
    <button id="send" title="Send">➤</button>
  </div>
</div>

<script src="js/sprites.js"></script>
<script src="js/world.js"></script>
<script src="js/looks.js"></script>
<script>
// Suma on the player's iPhone: the desk phone (teammates' questions), the team, and the reports.
// While Suma runs (on the computer, or the night shift in the cloud) it talks to the office live.
// When nothing is running, it still shows the latest calls and reports, takes answers, and wakes
// the night shift (if the studio owner set that up). Everything that goes through the relay is
// encrypted with a key that only this phone and the office have.
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const NPCS = Suma.world.NPCS;
  const BASE = Object.fromEntries(Object.entries(NPCS).map(([id, n]) => [id, n.look]));
  const NTFY = 'https://ntfy.sh';
  const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem('suma.' + k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem('suma.' + k, JSON.stringify(v)); } catch {} } };

  // ---- this phone's setup (from the QR code at the desk phone): t topic, k key, o office key, v push key
  const frag = new URLSearchParams(location.hash.slice(1));
  if (frag.get('t') && frag.get('k')) {
    store.set('cfg', { t: frag.get('t'), k: frag.get('k'), o: frag.get('o') || '', v: frag.get('v') || '' });
    history.replaceState(null, '', location.pathname);
  }
  const C = store.get('cfg', null);
  const S = { tab: 'calls', office: store.get('office', null), calls: store.get('calls', null), reports: store.get('reports', null), team: store.get('team', null), live: false, open: null, pics: [], sending: false, outbox: store.get('outbox', []), hist: store.get('hist', {}) };

  const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
  const team = () => (S.team && S.team.team) || {};
  const name = (id) => (team()[id] || {}).name || (NPCS[id] || {}).name || id;
  function face(id, scale = 3) { const t = team()[id]; return Suma.sprites.portrait(id, t ? Suma.looks.apply(BASE[id], t) : BASE[id], scale); }
  const strip = (t) => String(t || '').replace(/\[\[note\]\][\s\S]*?(\[\[\/note\]\]|$)/gi, '').replace(/\[\[\s*ask\s*:\s*([^\]]*)\]\]/gi, '\n📞 $1').replace(/\[\[[\s\S]*?\]\]/g, '').replace(/\*\*/g, '').trim();

  // ---- sealing (AES-256-GCM, same as the office)
  const b64 = { to: (u8) => btoa(String.fromCharCode(...u8)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''), from: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0)) };
  let keyP = null;
  const key = () => keyP || (keyP = crypto.subtle.importKey('raw', b64.from(C.k), 'AES-GCM', false, ['encrypt', 'decrypt']));
  async function seal(obj) { const iv = crypto.getRandomValues(new Uint8Array(12)); const c = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await key(), new TextEncoder().encode(JSON.stringify(obj)))); const out = new Uint8Array(12 + c.length); out.set(iv); out.set(c, 12); return out; }
  async function unseal(text) { const buf = b64.from(text); const p = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, await key(), buf.slice(12)); return JSON.parse(new TextDecoder().decode(p)); }
  async function relay(obj) { const res = await fetch(NTFY + '/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: C.t + '-a', message: b64.to(await seal(obj)) }) }); return res.ok; }

  const pushKey = () => C.v || (S.office && S.office.vapid) || '';
  // ---- the office's state from the relay
  function take(s) {
    if (!s || !s.kind) return;
    if (s.kind === 'office' && (!S.office || s.at >= S.office.at)) { S.office = s; store.set('office', s); }
    if (s.kind === 'calls' && (!S.calls || s.at >= S.calls.at)) {
      S.calls = s; store.set('calls', s);
      S.outbox = S.outbox.filter((m) => !(s.acked || []).includes(m.id));
      // The office is back but hasn't got an answer that went through the relay: send it again now.
      S.outbox.forEach((m) => { if (m.relayed && s.at > m.relayed + 60000) m.relayed = 0; });
      store.set('outbox', S.outbox);
    }
    if (s.kind === 'reports' && (!S.reports || s.at >= S.reports.at)) { S.reports = s; store.set('reports', s); }
    if (s.kind === 'team' && (!S.team || s.at >= S.team.at)) { S.team = s; store.set('team', s); }
    if (s.kind === 'history' && s.npc) { S.hist[s.npc] = s; store.set('hist', S.hist); if (S.open === s.npc) drawChat(); }
  }
  async function pull() {
    try {
      const lines = (await (await fetch(NTFY + '/' + C.t + '-s/json?poll=1&since=12h', { cache: 'no-store' })).text()).trim().split('\n');
      for (const l of lines) { try { const m = JSON.parse(l); if (m.event === 'message') take(await unseal(m.message)); } catch {} }
    } catch {}
  }
  function stream() {
    try {
      const es = new EventSource(NTFY + '/' + C.t + '-s/sse');
      es.onmessage = async (e) => { try { const m = JSON.parse(e.data); if (m.event === 'message') { take(await unseal(m.message)); await checkLive(); flushOutbox(); S.open ? drawChat() : render(); } } catch {} };
    } catch {}
  }

  // ---- the office live (Suma is running here or in the cloud)
  const liveUrl = () => (S.office && S.office.online && S.office.liveUrl) || null;
  const lapi = (p, body) => fetch(liveUrl() + p, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-suma-phone': C.o }, body: JSON.stringify(body) } : { headers: { 'x-suma-phone': C.o }, cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  async function checkLive() {
    if (!liveUrl() || !C.o) { S.live = false; return; }
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 5000);
      const r = await fetch(liveUrl() + '/phone/api/state', { headers: { 'x-suma-phone': C.o }, signal: ctl.signal, cache: 'no-store' });
      if (!r.ok) throw new Error();
      const d = await r.json();
      S.live = true;
      take({ kind: 'calls', at: Date.now(), calls: d.calls.map((c) => ({ ...c, name: (d.team[c.npc] || {}).name })), acked: S.calls ? S.calls.acked : [] });
      take({ kind: 'reports', at: Date.now(), reports: d.reports });
      take({ kind: 'team', at: Date.now(), team: d.team, npcs: d.npcs, game: d.game, player: d.player });
      flushOutbox();
    } catch { S.live = false; }
  }

  // ---- answers: live when the office is running, otherwise kept and sent through the relay
  async function flushOutbox() {
    for (const m of S.outbox.slice()) {
      if (S.live) {
        try { await lapi('/phone/api/chat', { npc: m.npc, text: m.text, images: (m.images || []).map((d) => ({ dataUrl: d })), answerId: m.id }); S.outbox = S.outbox.filter((x) => x.id !== m.id); } catch {}
      } else if ((!m.relayed || Date.now() - m.relayed > 10 * 3600000) && !(m.images || []).length) {
        // Through the relay (kept there ~12 hours; re-sent if the office hasn't picked it up by then).
        // Pictures are too big for the relay: those wait on the phone until the office is open.
        try { if (await relay({ type: 'answer', id: m.id, npc: m.npc, text: m.text, at: m.at, save: S.office && S.office.save })) m.relayed = Date.now(); } catch {}
      }
    }
    store.set('outbox', S.outbox);
  }
  // Nothing running? Wake the night shift so the team can answer right away (if the owner set it up).
  async function wakeTeam() {
    const g = S.office && S.office.wake;
    if (!g || Date.now() - store.get('woke', 0) < 10 * 60000) return false;
    try {
      const r = await fetch('https://api.github.com/repos/' + g.repo + '/actions/workflows/night-shift.yml/dispatches', { method: 'POST', headers: { Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json' }, body: JSON.stringify({ ref: 'main', inputs: { reason: 'phone' } }) });
      if (r.ok || r.status === 204) { store.set('woke', Date.now()); return true; }
    } catch {}
    return false;
  }

  // ---- screens
  // Redraws only when something changed (so taps never land on a list that just moved).
  let lastRender = '';
  function render() {
    const sig = JSON.stringify([S.tab, S.live, S.office, S.calls, S.reports, S.team && S.team.at, S.outbox.length, store.get('notify', false)]);
    if (sig === lastRender && document.querySelector('#list').children.length) return;
    lastRender = sig;
    if (!C) {
      $('#list').innerHTML = '<div class="panel"><h2>WELCOME TO SUMA</h2>Scan the code on your <b>desk phone</b> in Suma to connect this phone to your studio.</div>';
      $('#status').textContent = 'not connected'; return;
    }
    const office = S.office;
    const live = S.live;
    $('#status').textContent = live ? '🟢 Office open' : office && office.online === false ? '🌙 Office closed' : '🌙 Office closed';
    $('#status').classList.toggle('on', live);
    const tm = S.team || {};
    $('#game').textContent = [tm.player || (office && office.player), tm.game || (office && office.game)].filter(Boolean).join(' · ');
    const calls = ((S.calls && S.calls.calls) || []).slice().sort((a, b) => b.at - a.at);
    $('#calls-n').innerHTML = calls.length ? '<span class="badge">' + calls.length + '</span>' : '';
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.id === 'tab-' + S.tab));
    const list = $('#list');
    list.innerHTML = '';
    const card = (id, html, cls, onclick) => {
      const b = document.createElement('button'); b.className = 'card ' + (cls || '');
      b.appendChild(face(id)); const div = document.createElement('div'); div.innerHTML = html; b.appendChild(div);
      if (onclick) b.onclick = onclick; list.appendChild(b);
    };
    if (S.tab === 'calls') {
      if (!calls.length) list.innerHTML = '<div class="empty">☎️<br>No calls right now.<br>When a teammate has a question, it shows up here.</div>';
      calls.forEach((c) => card(c.npc, '<div class="who">' + esc(name(c.npc)) + '</div><div class="q">' + esc(c.question) + '</div><div class="t">' + ago(c.at) + (c.taskTitle ? ' · ' + esc(c.taskTitle) : '') + '</div>', 'call', () => openChat(c.npc)));
      settings(list);
    } else if (S.tab === 'team') {
      Object.keys(NPCS).forEach((id) => card(id, '<div class="who">' + esc(name(id)) + '</div><div class="role">' + esc(NPCS[id].role) + '</div>' + (live && tm.npcs && tm.npcs[id] && tm.npcs[id].busy ? '<div class="busy">● working</div>' : ''), '', () => openChat(id)));
    } else {
      const reps = (S.reports && S.reports.reports) || [];
      if (!reps.length) list.innerHTML = '<div class="empty">📋<br>No reports yet.<br>Each time the team finishes something, a short report lands here.</div>';
      reps.forEach((r) => { const div = document.createElement('div'); div.className = 'card rep';
        div.innerHTML = '<div class="title">✅ ' + esc(r.title) + '</div><div class="t">' + (r.who ? esc(name(r.who)) + ' · ' : '') + ago(r.at) + '</div>' + (r.what ? '<div class="q">' + esc(r.what) + '</div>' : '') + (r.answers || []).map((a) => '<div class="said">💬 You said: "' + esc(a.a) + '"</div>').join('');
        list.appendChild(div); });
    }
    list.insertAdjacentHTML('beforeend', '<div class="hint">' + (live ? 'Your office is open: your team answers right away.' : 'Your office is closed. You can still answer: the team gets it as soon as Suma opens' + (office && office.wake ? ', and your answer wakes up the night shift' : '') + '.') + '</div>');
  }
  // Notifications (and installing): shown under the calls.
  function settings(list) {
    const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    const div = document.createElement('div'); div.className = 'panel';
    if (!standalone && /iPhone|iPad/.test(navigator.userAgent)) {
      div.innerHTML = '<h2>PUT SUMA ON YOUR HOME SCREEN</h2>Tap the <b>Share</b> button (the square with the arrow) at the bottom of Safari, then <b>Add to Home Screen</b>. Then open Suma from your home screen, like any app. (That\'s also what lets your phone ring.)';
    } else if (!('PushManager' in window) || !pushKey()) {
      div.innerHTML = '<h2>NOTIFICATIONS</h2>This browser can\'t show Suma notifications. Open Suma from your home screen on your iPhone.';
    } else {
      const on = store.get('notify', false) && Notification.permission === 'granted';
      div.innerHTML = '<div class="switch"><span>🔔 <b>Ring my phone</b><br><span style="color:#b8b0c8;font-size:14px">when a teammate has a question and I\'m away from the computer</span></span><input type="checkbox" id="notify" ' + (on ? 'checked' : '') + '></div>';
      div.querySelector('#notify').onchange = (e) => setNotify(e.target.checked, e.target);
    }
    list.appendChild(div);
  }
  async function setNotify(on, box) {
    try {
      const reg = await navigator.serviceWorker.ready;
      if (on) {
        if ((await Notification.requestPermission()) !== 'granted') throw new Error('Notifications are blocked. Turn them on in iPhone Settings → Suma → Notifications.');
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64.from(pushKey()) });
        const json = sub.toJSON();
        await relay({ type: 'subscribe', sub: { endpoint: json.endpoint, keys: json.keys } });
        if (S.live) lapi('/phone/api/subscribe', { sub: { endpoint: json.endpoint, keys: json.keys } }).catch(() => {});
      } else {
        const sub = await reg.pushManager.getSubscription();
        if (sub) { await relay({ type: 'unsubscribe', endpoint: sub.endpoint }); await sub.unsubscribe(); }
      }
      store.set('notify', on);
    } catch (e) { alert(e.message || 'That didn\'t work. Try again.'); if (box) box.checked = !on; }
  }

  // ---- chat with one teammate
  async function openChat(id) {
    S.open = id;
    $('#chat').classList.remove('hidden');
    $('#chat-name').textContent = name(id); $('#chat-role').textContent = NPCS[id].role;
    const c = $('#chat-face'); const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, 48, 60); g.drawImage(face(id, 3), 0, 0);
    drawChat(); await loadChat();
  }
  async function loadChat() {
    if (!S.open) return;
    if (S.live) {
      try { const h = await lapi('/phone/api/history?npc=' + S.open); S.hist[S.open] = { npc: S.open, msgs: h.history, busy: h.busy, draft: h.draft, at: Date.now() }; store.set('hist', S.hist); } catch {}
    }
    drawChat();
  }
  function drawChat() {
    if (!S.open) return;
    const h = S.hist[S.open] || { msgs: [] };
    const call = ((S.calls && S.calls.calls) || []).find((c) => c.npc === S.open);
    let msgs = (h.msgs || []).slice();
    // Offline and nothing saved yet: the call's own recent lines.
    if (!msgs.length && call && call.recent) msgs = call.recent;
    const mine = S.outbox.filter((m) => m.npc === S.open && !msgs.some((x) => x.role === 'user' && x.text === m.text));
    const log = $('#log');
    log.innerHTML = msgs.map((m) => '<div class="msg ' + (m.role === 'user' ? 'user' : m.role === 'note' ? 'note' : 'npc') + '">' + esc(strip(m.text)) + (m.images ? ' 📷' : '') + '</div>').join('') +
      mine.map((m) => '<div class="msg user waiting">' + esc(m.text) + (m.images && m.images.length ? ' 📷' : '') + '<div style="font-size:12px;margin-top:3px">' + (S.live ? 'sending…' : m.images && m.images.length ? '📮 saved: sends when your office is open (pictures can\'t go through while it\'s closed)' : '📮 saved: delivered when the team is back') + '</div></div>').join('') +
      (S.live && h.busy ? '<div class="typing">' + esc(name(S.open)) + ' is typing...' + (h.draft ? '<div class="msg npc" style="margin-top:6px">' + esc(strip(h.draft)) + '</div>' : '') + '</div>' : '');
    $('#offline').hidden = S.live;
    $('#offline').textContent = S.office && S.office.wake ? '🌙 Your office is closed. Send your answer anyway: it wakes up the team in the cloud (takes a couple of minutes).' : '🌙 Your office is closed. Send your answer anyway: the team gets it as soon as Suma opens on your computer.';
    const lastNpc = [...msgs].reverse().find((m) => m.role === 'npc');
    const ch = lastNpc && /\[\[\s*choices\s*:\s*([^\]]+)\]\]/i.exec(lastNpc.text);
    const choices = ch ? ch[1].split('|').map((x) => x.trim()).filter(Boolean) : (call && call.choices) || [];
    $('#choices').innerHTML = '';
    const lastIsNpc = !msgs.length || msgs[msgs.length - 1].role !== 'user';
    if (lastIsNpc && !mine.length && !(S.live && h.busy)) choices.slice(0, 5).forEach((t) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => send(t); $('#choices').appendChild(b); });
    log.scrollTop = log.scrollHeight;
  }
  function closeChat() { S.open = null; $('#chat').classList.add('hidden'); lastRender = ''; render(); }
  async function send(text) {
    const t = (text != null ? text : $('#text').value).trim();
    if ((!t && !S.pics.length) || S.sending) return;
    S.sending = true; $('#send').disabled = true;
    const m = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), npc: S.open, text: t, images: S.pics.slice(), at: Date.now() };
    S.outbox.push(m); store.set('outbox', S.outbox);
    $('#text').value = ''; S.pics = []; $('#pics').innerHTML = ''; autosize();
    drawChat();
    await checkLive();
    await flushOutbox();
    if (!S.live) { if (await wakeTeam()) toast('Waking up your team in the cloud… (about 2 minutes)'); }
    await loadChat();
    S.sending = false; $('#send').disabled = false;
  }
  function toast(t) { const d = document.createElement('div'); d.className = 'offline-note'; d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:90px;z-index:9;background:#3a2a60;border:2px solid #ffcc33'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 5000); }
  function addPics(files) {
    [...files].slice(0, 4).forEach((f) => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 1400 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.8);
        S.pics.push(url); $('#pics').insertAdjacentHTML('beforeend', '<img src="' + url + '" alt="">'); URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(f);
    });
  }
  function autosize() { const t = $('#text'); t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    $('#mic').hidden = false; let rec = null;
    $('#mic').onclick = () => {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
      const before = $('#text').value ? $('#text').value + ' ' : '';
      rec.onresult = (e) => { let s = ''; for (const r of e.results) s += r[0].transcript; $('#text').value = before + s; autosize(); };
      rec.onend = () => { rec = null; $('#mic').classList.remove('on'); };
      $('#mic').classList.add('on'); rec.start();
    };
  }
  $('#tab-calls').onclick = () => { S.tab = 'calls'; render(); };
  $('#tab-team').onclick = () => { S.tab = 'team'; render(); };
  $('#tab-reports').onclick = () => { S.tab = 'reports'; render(); };
  $('#back').onclick = closeChat;
  $('#send').onclick = () => send();
  $('#attach').onclick = () => $('#file').click();
  $('#file').onchange = (e) => { addPics(e.target.files); e.target.value = ''; };
  $('#text').addEventListener('input', autosize);

  // ---- start
  async function start() {
    render();
    if (!C) return;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
      // The notification helper reads the key from here (it can't see this page's storage).
      caches.open('suma-config').then((c) => c.put('/__suma_config', new Response(JSON.stringify({ t: C.t, k: C.k })))).catch(() => {});
    }
    await pull(); await checkLive(); render();
    if (!store.get('hello', false)) { relay({ type: 'hello', at: Date.now(), ua: navigator.userAgent.slice(0, 80) }).then((ok) => ok && store.set('hello', true)); if (S.live) lapi('/phone/api/hello', {}).catch(() => {}); }
    stream();
    flushOutbox();
    setInterval(async () => { if (document.hidden) return; await checkLive(); if (S.open) loadChat(); else render(); }, 4000);
    document.addEventListener('visibilitychange', async () => { if (!document.hidden) { await pull(); await checkLive(); S.open ? loadChat() : render(); } });
  }
  start();
})();
</script>
</body>
